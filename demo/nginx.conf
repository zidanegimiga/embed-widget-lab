server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # Revalidate on every load so a redeploy is picked up straight away.
    # Unchanged files still come back as a cheap 304.
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
