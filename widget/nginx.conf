server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    # Script tags work cross-origin without CORS, but ESM imports and SRI checks need it.
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  location = /health {
    return 200 "ok";
  }
}
